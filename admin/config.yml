backend:
  name: turbo-github
  turbo_site_id: b3092fba-1811-458a-ad46-eb50526c571b
  branch: main

# Las imágenes se guardan en la misma carpeta que publica Vite (dist/assets).
# public_folder debe coincidir con la ruta con la que la web las sirve.
media_folder: assets
public_folder: /assets

collections:
  - name: clinic-content
    label: Contenido de la clínica
    files:
      - name: clinic
        label: Información general
        file: content/clinic.json
        fields:
          - label: Nombre de la clínica
            name: name
            widget: string
          - label: Ciudad
            name: city
            widget: string
          - label: País
            name: country
            widget: string
          - label: Dirección
            name: address
            widget: string
          - label: Teléfono visible
            name: phoneDisplay
            widget: string
          - label: Teléfono internacional
            name: phoneRaw
            widget: string
          - label: Número de WhatsApp
            name: whatsappNumber
            widget: string
          - label: Enlace de Google Maps
            name: mapsUrl
            widget: string
          - label: Público atendido
            name: audience
            widget: string
          - label: Horario de atención (texto visible en la web y el asistente)
            name: hours
            widget: object
            fields:
              - label: Días
                name: days
                widget: string
              - label: Horario de mañana
                name: morning
                widget: string
              - label: Horario de tarde
                name: afternoon
                widget: string
          - label: Redes sociales
            name: social
            widget: object
            fields:
              - label: Facebook
                name: facebook
                widget: string
              - label: Instagram
                name: instagram
                widget: string
              - label: TikTok
                name: tiktok
                widget: string
          - label: Imágenes principales y logotipos
            name: images
            widget: object
            fields:
              - label: Logotipo principal
                name: logo
                widget: image
                required: false
              - label: Logotipo blanco (footer)
                name: logoWhite
                widget: image
                required: false
              - label: Logotipo de la barra de navegación
                name: logoNavbar
                widget: image
                required: false
              - label: Logotipo con texto (portada)
                name: logoText
                widget: image
                required: false
              - label: Logotipo dentado (portada)
                name: logoTooth
                widget: image
                required: false
              - label: Fotografía amplia de recepción (portada)
                name: heroReceptionWide
                widget: image
                required: false
              - label: Fotografía de recepción (portada, versión cercana)
                name: heroReceptionClose
                widget: image
                required: false
              - label: Fotografía del área de consultoría
                name: aboutRoom
                widget: image
                required: false
              - label: Imagen del mapa
                name: mapImage
                widget: image
                required: false
              - label: Fotografía del equipo en la clínica
                name: teamGroupClinic
                widget: image
                required: false
              - label: Fotografía del equipo en evento
                name: teamGroupEvent
                widget: image
                required: false
              - label: Fotografía del equipo en la entrada
                name: teamGroupFront
                widget: image
                required: false
          - label: Textos de la portada
            name: content
            widget: object
            fields:
              - label: Texto principal de la portada
                name: heroTitle
                widget: text
                required: false
              - label: Título de la sección Nosotros
                name: aboutTitle
                widget: string
                required: false
              - label: Texto de la sección Nosotros
                name: aboutText
                widget: text
                required: false
              - label: Título de beneficios
                name: benefitsTitle
                widget: string
                required: false
              - label: Introducción de beneficios
                name: benefitsIntro
                widget: text
                required: false
              - label: Beneficios
                name: benefits
                widget: list
                label_singular: beneficio
                summary: '{{fields.title}}'
                required: false
                allow_add: true
                allow_remove: true
                allow_reorder: true
                fields:
                  - label: Título
                    name: title
                    widget: string
                  - label: Descripción
                    name: description
                    widget: text
                  - label: Imagen
                    name: image
                    widget: image
                    required: true
              - label: Indicadores de la sección Nosotros
                name: aboutStats
                widget: list
                label_singular: indicador
                summary: '{{fields.value}} — {{fields.label}}'
                required: false
                fields:
                  - label: Valor visible
                    name: value
                    widget: string
                  - label: Descripción
                    name: label
                    widget: string
              - label: Introducción de la sección Equipo
                name: teamIntro
                widget: text
                required: false
              - label: Introducción de la sección Contacto
                name: contactIntro
                widget: text
                required: false
              - label: Texto del footer
                name: footerText
                widget: text
                required: false
          - label: SEO
            name: seo
            widget: object
            required: false
            fields:
              - label: Título para buscadores
                name: title
                widget: string
                required: false
              - label: Descripción para buscadores
                name: description
                widget: text
                required: false
              - label: Imagen para redes sociales
                name: ogImage
                widget: image
                required: false
              - label: Texto alternativo de la imagen SEO
                name: ogImageAlt
                widget: string
                required: false
              - label: Palabras clave
                name: keywords
                widget: string
                required: false

      - name: treatments
        label: Tratamientos
        file: content/treatments.json
        fields:
          - label: Tratamientos
            name: treatments
            widget: list
            label_singular: tratamiento
            summary: '{{fields.name}}'
            allow_add: true
            allow_remove: true
            allow_reorder: true
            fields:
              - label: Nombre
                name: name
                widget: string
              - label: Descripción publicada
                name: description
                widget: text
              - label: Imagen
                name: image
                widget: image
                required: false
                choose_url: true
              - label: Puntos destacados
                name: highlights
                widget: list
                label_singular: punto
                field:
                  label: Punto destacado
                  name: highlight
                  widget: string
              - label: Profesional asociado
                name: specialist
                widget: string
                required: false
              - label: Términos de búsqueda del asistente
                name: keywords
                widget: list
                label_singular: término
                field:
                  label: Término
                  name: keyword
                  widget: string

      - name: professionals
        label: Profesionales
        file: content/professionals.json
        fields:
          - label: Profesionales
            name: professionals
            widget: list
            label_singular: profesional
            summary: '{{fields.name}} — {{fields.role}}'
            allow_add: true
            allow_remove: true
            allow_reorder: true
            fields:
              - label: Nombre publicado
                name: name
                widget: string
              - label: Área o rol publicado
                name: role
                widget: string
              - label: Registro profesional publicado
                name: registry
                widget: string
                required: false
              - label: Biografía publicada
                name: bio
                widget: text
              - label: Fotografía
                name: image
                widget: image
                required: false
                choose_url: true
              - label: Frase destacada (opcional)
                name: quote
                widget: string
                required: false

      - name: gallery
        label: Galería de ambientes y tecnología
        file: content/gallery.json
        fields:
          - label: Elementos de la galería
            name: items
            widget: list
            label_singular: elemento
            summary: '{{fields.title}} ({{fields.category}})'
            allow_add: true
            allow_remove: true
            allow_reorder: true
            fields:
              - label: Título
                name: title
                widget: string
              - label: Categoría
                name: category
                widget: select
                options:
                  - label: Ambientes
                    value: ambientes
                  - label: Tecnología
                    value: tecnologia
              - label: Imagen principal
                name: image
                widget: image
                required: false
                choose_url: true
              - label: Texto alternativo de la imagen
                name: imageAlt
                widget: string
                required: false
              - label: Segunda imagen
                name: secondaryImage
                widget: image
                required: false
                choose_url: true
              - label: Subtítulo publicado
                name: subtitle
                widget: string
                required: false
              - label: Etiqueta publicada
                name: label
                widget: string
                required: false
              - label: Número publicado
                name: number
                widget: string
                required: false
              - label: Descripción publicada
                name: description
                widget: text
                required: false
              - label: Beneficios publicados
                name: benefits
                widget: list
                label_singular: beneficio
                field:
                  label: Beneficio
                  name: benefit
                  widget: string

      - name: videos
        label: Videos y contenido audiovisual
        file: content/videos.json
        fields:
          - label: Videos publicados
            name: videos
            widget: list
            label_singular: video
            summary: '{{fields.title}} — {{fields.category}}'
            allow_add: true
            allow_remove: true
            allow_reorder: true
            fields:
              - label: Título
                name: title
                widget: string
              - label: Descripción
                name: description
                widget: text
                required: false
              - label: Miniatura
                name: thumbnail
                widget: image
                required: false
                choose_url: true
              - label: Archivo o URL de video
                name: videoUrl
                widget: file
                choose_url: true
                hint: Puedes elegir un video de la biblioteca o pegar una ruta publicada como /videos/tratamientos-1.mp4.
              - label: Duración visible
                name: duration
                widget: string
                required: false
              - label: Categoría
                name: category
                widget: select
                options:
                  - label: Tratamientos
                    value: tratamientos
                  - label: Ambientes
                    value: ambientes
                  - label: Tecnología
                    value: tecnologia
                  - label: Eventos
                    value: eventos
              - label: Plataforma
                name: platform
                widget: hidden
                default: local

      - name: assistant-faqs
        label: Preguntas frecuentes del asistente
        file: content/assistant-faqs.json
        fields:
          - label: Preguntas frecuentes
            name: faqs
            widget: list
            label_singular: tema
            summary: '{{fields.topic}}'
            allow_add: true
            allow_remove: true
            allow_reorder: true
            fields:
              - label: Identificador actual
                name: id
                widget: string
                hint: 'Los identificadores hours, location, contact, social, videos, team, technology, facilities y children activan botones específicos del asistente. No los cambies si no es necesario.'
              - label: Tema
                name: topic
                widget: string
              - label: Términos que reconoce el asistente
                name: keywords
                widget: list
                label_singular: término
                field:
                  label: Término
                  name: keyword
                  widget: string
              - label: Respuesta publicada
                name: answer
                widget: text
